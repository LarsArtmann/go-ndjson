name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Flake gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Flake check (incl. formatting via treefmt)
        run: nix flake check

      - name: Build
        run: nix run .#build

      - name: Vet
        run: nix run .#vet

      - name: Lint
        run: nix run .#lint

      - name: Test
        run: nix run .#test

      - name: Test with race detector
        run: nix run .#test-race
